services:
  group-reader:
    build: .
    container_name: sky-group-reader
    restart: unless-stopped        # starts again after crashes and after the VPS reboots
    env_file: .env
    shm_size: "512mb"              # Chromium needs shared memory
    volumes:
      - skycars-reader-state:/var/lib/skycars-group-reader
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  skycars-reader-state:
